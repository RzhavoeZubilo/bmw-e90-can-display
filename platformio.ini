; BMW E90 CAN display — Arduino Nano (ATmega328P)
;
; Два environment'а:
;   nano   — боевая прошивка
;   native — юнит-тесты чистой логики, компилируются и запускаются на macOS
;
; Тесты:   pio test -e native
; Сборка:  pio run -e nano
; Прошивка: pio run -e nano -t upload

[platformio]
; native собирается только через `pio test`, своих исходников у него нет.
default_envs = nano

[avr_common]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -Wall
    ; Кварц на модуле MCP2515. Дешёвые платы бывают и с 8, и с 16 МГц —
    ; посмотрите маркировку на самом кристалле. Неверное значение = CAN не поднимется.
    -D MCP2515_CRYSTAL_MHZ=8

[env:nano]
extends = avr_common
build_src_filter = +<*> -<sniffer.cpp>
lib_deps =
    coryjfowler/mcp_can@^1.5.1
    olikraus/U8g2@^2.35.30
    fastled/FastLED@^3.7.0

; Диагностическая прошивка: только MCP2515 + Serial, без дисплея и лент.
[env:sniffer]
extends = avr_common
build_src_filter = +<sniffer.cpp>
lib_deps = coryjfowler/mcp_can@^1.5.1

[env:native]
platform = native
test_framework = unity
build_flags = -Wall -std=gnu++17
; Environment только для тестов: src/ — это Arduino-код, на хосте он не собирается.
; Тестируются библиотеки из lib/, не зависящие от Arduino.
build_src_filter = -<*>
