<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-label="План дна корпуса 84 на 62 мм: MCP2515 в левой задней части, Arduino Nano вдоль правой стенки разъёмом USB к задней стенке, Mini360 и зуммер спереди, четыре бобышки под винты по углам">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1B1F24"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="480" height="400" fill="#F2F4F6"/>

  <!-- корпус -->
  <rect x="70" y="70" width="336" height="248" fill="none" stroke="#1B1F24" stroke-width="2"/>
  <rect x="78" y="78" width="320" height="232" fill="none" stroke="#1B1F24" stroke-width="1" opacity=".45"/>

  <!-- бобышки под винты -->
  <circle cx="92" cy="92" r="11" fill="none" stroke="#1B1F24" stroke-width="1.2"/>
  <circle cx="92" cy="92" r="3.4" fill="#1B1F24"/>
  <circle cx="384" cy="92" r="11" fill="none" stroke="#1B1F24" stroke-width="1.2"/>
  <circle cx="384" cy="92" r="3.4" fill="#1B1F24"/>
  <circle cx="92" cy="296" r="11" fill="none" stroke="#1B1F24" stroke-width="1.2"/>
  <circle cx="92" cy="296" r="3.4" fill="#1B1F24"/>
  <circle cx="384" cy="296" r="11" fill="none" stroke="#1B1F24" stroke-width="1.2"/>
  <circle cx="384" cy="296" r="3.4" fill="#1B1F24"/>

  <!-- MCP2515 -->
  <rect x="108" y="86" width="160" height="112" fill="none" stroke="#1B1F24" stroke-width="1.6"/>
  <rect x="108" y="86" width="160" height="16" fill="#1B1F24" opacity=".14"/>
  <text x="188" y="136" font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle" fill="#1B1F24">MCP2515</text>
  <text x="188" y="152" font-family="ui-monospace, Menlo, monospace" font-size="11" text-anchor="middle" fill="#1B1F24" opacity=".62">40 × 28 × 14</text>
  <text x="188" y="98" font-family="ui-monospace, Menlo, monospace" font-size="9.5" text-anchor="middle" fill="#1B1F24" opacity=".75">клеммник CAN</text>

  <!-- Nano -->
  <rect x="300" y="86" width="72" height="180" fill="none" stroke="#1B1F24" stroke-width="1.6"/>
  <rect x="312" y="86" width="48" height="14" fill="#1B1F24" opacity=".2"/>
  <text x="336" y="180" font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle" fill="#1B1F24">Nano</text>
  <text x="336" y="196" font-family="ui-monospace, Menlo, monospace" font-size="11" text-anchor="middle" fill="#1B1F24" opacity=".62">45 × 18</text>

  <!-- Mini360 -->
  <rect x="100" y="220" width="68" height="44" fill="none" stroke="#1B1F24" stroke-width="1.6"/>
  <text x="134" y="247" font-family="ui-monospace, Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#1B1F24">Mini360</text>

  <!-- зуммер -->
  <rect x="190" y="220" width="76" height="60" fill="none" stroke="#1B1F24" stroke-width="1.6"/>
  <circle cx="228" cy="250" r="20" fill="none" stroke="#1B1F24" stroke-width="1" opacity=".5"/>
  <text x="228" y="253" font-family="ui-monospace, Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#1B1F24">KY-006</text>

  <!-- вырез USB-C в задней стенке -->
  <rect x="312" y="62" width="48" height="16" fill="#F2F4F6"/>
  <path d="M312,78 L312,62 M360,78 L360,62" stroke="#0B5C86" stroke-width="2.4"/>
  <text x="336" y="52" font-family="ui-monospace, Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#0B5C86">вырез USB-C</text>
  <text x="336" y="38" font-family="ui-monospace, Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#0B5C86">12 × 7</text>

  <!-- кабельный ввод -->
  <circle cx="150" cy="74" r="14" fill="#F2F4F6" stroke="#0B5C86" stroke-width="2"/>
  <text x="150" y="38" font-family="ui-monospace, Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#0B5C86">ввод ⌀7</text>
  <text x="150" y="52" font-family="ui-monospace, Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#0B5C86">4 провода</text>

  <!-- размеры -->
  <line x1="70" y1="352" x2="406" y2="352" stroke="#1B1F24" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="238" y="370" font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle" fill="#1B1F24">84</text>
  <line x1="440" y1="70" x2="440" y2="318" stroke="#1B1F24" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="458" y="198" font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle" fill="#1B1F24">62</text>

  <text x="238" y="392" font-family="ui-monospace, Menlo, monospace" font-size="10.5" text-anchor="middle" fill="#1B1F24" opacity=".6">↑ задняя стенка — к лобовому стеклу</text>
</svg>
