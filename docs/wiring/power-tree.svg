<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Схема питания: 12 вольт после зажигания и масса кузова идут на Mini360, тот выдаёт 5 вольт на общую шину питания и общую массу, от которых запитаны Arduino Nano, MCP2515, OLED, WS2812 и TTP-223; зуммер KY-006 подключён только к массе. Пара CAN High и CAN Low выходит от MCP2515 к машине и с массой не соединяется">
  <defs>
    <marker id="w-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#1B1F24"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="470" fill="#F2F4F6"/>

  <!-- источник -->
  <rect x="20" y="218" width="112" height="84" fill="none" stroke="#1B1F24" stroke-width="1.6"/>
  <text x="76" y="246" font-family="ui-monospace, Menlo, monospace" font-size="11" text-anchor="middle" fill="#B07708">+12 В</text>
  <text x="76" y="260" font-family="ui-monospace, Menlo, monospace" font-size="9.5" text-anchor="middle" fill="#1B1F24" opacity=".7">после зажигания</text>
  <text x="76" y="284" font-family="ui-monospace, Menlo, monospace" font-size="11" text-anchor="middle" fill="#1B1F24">масса кузова</text>

  <!-- Mini360 -->
  <rect x="172" y="218" width="112" height="84" fill="none" stroke="#1B1F24" stroke-width="1.6"/>
  <text x="228" y="254" font-family="ui-monospace, Menlo, monospace" font-size="11.5" text-anchor="middle" fill="#1B1F24">Mini360</text>
  <text x="228" y="270" font-family="ui-monospace, Menlo, monospace" font-size="10" text-anchor="middle" fill="#1B1F24" opacity=".7">12 → 5.0 В</text>

  <line x1="132" y1="242" x2="172" y2="242" stroke="#B07708" stroke-width="2.4"/>
  <line x1="132" y1="280" x2="172" y2="280" stroke="#1B1F24" stroke-width="2.4"/>

  <!-- выход на шины -->
  <polyline points="284,242 302,242 302,150" fill="none" stroke="#B07708" stroke-width="2.4"/>
  <polyline points="284,280 302,280 302,368" fill="none" stroke="#1B1F24" stroke-width="2.4"/>

  <!-- шина +5 В -->
  <line x1="302" y1="150" x2="856" y2="150" stroke="#B07708" stroke-width="3.2"/>
  <text x="312" y="140" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#B07708">+5 В — одна общая шина</text>

  <!-- шина GND -->
  <line x1="302" y1="368" x2="856" y2="368" stroke="#1B1F24" stroke-width="3.2"/>
  <text x="312" y="388" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#1B1F24">GND — одна общая земля на всё устройство</text>

  <!-- Nano -->
  <rect x="322" y="222" width="104" height="74" fill="none" stroke="#1B1F24" stroke-width="1.8"/>
  <text x="374" y="254" font-family="ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle" fill="#1B1F24">Nano</text>
  <text x="374" y="270" font-family="ui-monospace, Menlo, monospace" font-size="9.5" text-anchor="middle" fill="#1B1F24" opacity=".7">вход 5V, не VIN</text>
  <line x1="374" y1="150" x2="374" y2="222" stroke="#B07708" stroke-width="2"/>
  <line x1="374" y1="296" x2="374" y2="368" stroke="#1B1F24" stroke-width="2"/>
  <circle cx="374" cy="150" r="4" fill="#B07708"/>
  <circle cx="374" cy="368" r="4" fill="#1B1F24"/>

  <!-- MCP2515 -->
  <rect x="452" y="222" width="104" height="74" fill="none" stroke="#1B1F24" stroke-width="1.8"/>
  <text x="504" y="254" font-family="ui-monospace, Menlo, monospace" font-size="11.5" text-anchor="middle" fill="#1B1F24">MCP2515</text>
  <text x="504" y="270" font-family="ui-monospace, Menlo, monospace" font-size="9.5" text-anchor="middle" fill="#1B1F24" opacity=".7">питание от Nano</text>
  <line x1="504" y1="150" x2="504" y2="222" stroke="#B07708" stroke-width="2"/>
  <line x1="504" y1="296" x2="504" y2="368" stroke="#1B1F24" stroke-width="2"/>
  <circle cx="504" cy="150" r="4" fill="#B07708"/>
  <circle cx="504" cy="368" r="4" fill="#1B1F24"/>

  <!-- OLED -->
  <rect x="582" y="222" width="88" height="74" fill="none" stroke="#1B1F24" stroke-width="1.8"/>
  <text x="626" y="262" font-family="ui-monospace, Menlo, monospace" font-size="11.5" text-anchor="middle" fill="#1B1F24">OLED</text>
  <line x1="626" y1="150" x2="626" y2="222" stroke="#B07708" stroke-width="2"/>
  <line x1="626" y1="296" x2="626" y2="368" stroke="#1B1F24" stroke-width="2"/>
  <circle cx="626" cy="150" r="4" fill="#B07708"/>
  <circle cx="626" cy="368" r="4" fill="#1B1F24"/>

  <!-- WS2812 -->
  <rect x="696" y="222" width="76" height="74" fill="none" stroke="#1B1F24" stroke-width="1.8"/>
  <text x="734" y="262" font-family="ui-monospace, Menlo, monospace" font-size="11" text-anchor="middle" fill="#1B1F24">WS2812</text>
  <line x1="734" y1="150" x2="734" y2="222" stroke="#B07708" stroke-width="2"/>
  <line x1="734" y1="296" x2="734" y2="368" stroke="#1B1F24" stroke-width="2"/>
  <circle cx="734" cy="150" r="4" fill="#B07708"/>
  <circle cx="734" cy="368" r="4" fill="#1B1F24"/>

  <!-- TTP-223 -->
  <rect x="798" y="222" width="76" height="74" fill="none" stroke="#1B1F24" stroke-width="1.8"/>
  <text x="836" y="256" font-family="ui-monospace, Menlo, monospace" font-size="11" text-anchor="middle" fill="#1B1F24">TTP-223</text>
  <text x="836" y="272" font-family="ui-monospace, Menlo, monospace" font-size="9" text-anchor="middle" fill="#1B1F24" opacity=".7">задел</text>
  <line x1="836" y1="150" x2="836" y2="222" stroke="#B07708" stroke-width="2"/>
  <line x1="836" y1="296" x2="836" y2="368" stroke="#1B1F24" stroke-width="2"/>
  <circle cx="836" cy="150" r="4" fill="#B07708"/>
  <circle cx="836" cy="368" r="4" fill="#1B1F24"/>

  <!-- KY-006: только земля -->
  <rect x="672" y="404" width="112" height="48" fill="none" stroke="#1B1F24" stroke-width="1.8"/>
  <text x="728" y="426" font-family="ui-monospace, Menlo, monospace" font-size="11" text-anchor="middle" fill="#1B1F24">KY-006</text>
  <text x="728" y="440" font-family="ui-monospace, Menlo, monospace" font-size="9" text-anchor="middle" fill="#1B1F24" opacity=".7">S + GND, питание не нужно</text>
  <line x1="728" y1="368" x2="728" y2="404" stroke="#1B1F24" stroke-width="2"/>
  <circle cx="728" cy="368" r="4" fill="#1B1F24"/>

  <!-- CAN: уходит в машину, с землёй не соединяется -->
  <polyline points="556,244 594,244 594,330" fill="none" stroke="#0B5C86" stroke-width="2.4"/>
  <path d="M594,362 A 9 9 0 0 0 594,380" fill="none" stroke="#0B5C86" stroke-width="2.4"/>
  <line x1="594" y1="330" x2="594" y2="362" stroke="#0B5C86" stroke-width="2.4"/>
  <polyline points="594,380 594,420 472,420" fill="none" stroke="#0B5C86" stroke-width="2.4" marker-end="url(#w-ar)"/>
  <rect x="330" y="398" width="142" height="44" fill="none" stroke="#0B5C86" stroke-width="1.8"/>
  <text x="401" y="418" font-family="ui-monospace, Menlo, monospace" font-size="11" text-anchor="middle" fill="#0B5C86">CAN H / CAN L</text>
  <text x="401" y="432" font-family="ui-monospace, Menlo, monospace" font-size="9" text-anchor="middle" fill="#0B5C86">витая пара PT-CAN</text>
  <text x="610" y="352" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#0B5C86">перескок — с массой НЕ соединяется</text>

  <!-- пояснение к точкам -->
  <circle cx="40" cy="404" r="4" fill="#1B1F24"/>
  <text x="54" y="408" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#1B1F24" opacity=".8">точка — соединение</text>
  <text x="40" y="436" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#1B1F24" opacity=".8">пересечение без точки — проводá не связаны</text>

  <text x="76" y="330" font-family="ui-monospace, Menlo, monospace" font-size="9.5" text-anchor="middle" fill="#1B1F24" opacity=".65">не от контакта 16 OBD</text>
</svg>
